# Copy this file to config/local.toml on each machine and fill in the paths.
# config/local.toml is ignored by git, so every machine keeps its own copy.
# Use forward slashes, also on Windows.

[paths]
# Folder with the CT volumes (read-only)
ct_dir_2526 = "data/ct/2526"
ct_dir_2425 = "data/ct/2425"
# The label CSV files (read-only)
labels_2425 = "data/labels_conference_pear_2425.csv"
labels_2526 = "data/labels_conference_pear_2526.csv"
# Hugo's trained VAE: the run folder with checkpoint.pth and vae_hyperparameter.json
encoder_dir = "data/weights/hugo_vae"
# Separate clone of github.com/Hugo-Li-Junyan/Synthetic_CT_pear at commit 183112f
# (not copied into this repository: no licence file)
hugo_repo = "../Synthetic_CT_pear"
# Where intermediate products and results are written
derived_dir = "derived"
results_dir = "results"

[data]
# Box letter in the volume file name. Pattern verified in Hugo's train_clf_3d.py for
# names like A30.nii; confirmed for the 2526 volumes on 3 October 2026. The 2425 optimal-
# storage fruit (G_opt, I_opt) do not match it and need separate handling.
box_pattern = "^([A-Oa-o])\\d+"

[compute]
# "auto" picks CUDA when available, then Apple MPS, then CPU
device = "auto"
# Batch size for encoding volumes; lower it if the GPU runs out of memory
encode_batch_size = 4
num_workers = 4
